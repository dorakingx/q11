<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Q11 Qollab harness (LOCAL FAKE — not Qollab, not IonQ)</title>
<link rel="stylesheet" href="/qollab/main.css" />
<style>
  body { margin: 0; background: #1b1b1f; color: #ddd; font-family: system-ui, sans-serif; }
  .harness-banner { background: #5a1d1d; color: #fff; padding: 8px 12px; font-size: 13px; }
  .harness-page { max-width: 1100px; margin: 16px auto; padding: 0 12px; }
  .harness-console { background: #000; color: #9f9; font: 12px/1.4 ui-monospace, monospace; padding: 8px; min-height: 80px; white-space: pre-wrap; margin-top: 12px; }
</style>
<script type="importmap">
{ "imports": {
  "q11.circuits": "/scripts/qollab-harness/shims/q11.circuits.js",
  "qiskit": "/scripts/qollab-harness/shims/qiskit.js"
} }
</script>
</head>
<body>
<div class="harness-banner">LOCAL HARNESS — fake <code>backend</code> and fake Python modules. Results here are NOT quantum simulations and are never IonQ results.</div>
<div class="harness-page">
  <div id="harness-body"></div>
  <div class="harness-console" id="harness-console">console:</div>
</div>
<script type="module">
  // Emulate the Qollab runtime surface used by qollab/main.js: body-only index.html injected, main.css loaded, `backend` global, console mirror.
  const body = await (await fetch('/qollab/index.html')).text();
  document.getElementById('harness-body').innerHTML = body;
  const con = document.getElementById('harness-console');
  const origLog = console.log.bind(console);
  console.log = (...args) => { origLog(...args); con.textContent += '\n' + args.map(a => typeof a === 'string' ? a : JSON.stringify(a)).join(' '); };
  const { FakeBackend } = await import('/scripts/qollab-harness/shims/backend.js');
  globalThis.backend = new FakeBackend('harness-fake-simulator');
  await import('/qollab/main.js');
</script>
</body>
</html>
